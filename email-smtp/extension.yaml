# Email over SMTP. Works with Gmail (an app password), Fastmail, Outlook,
# or any mail host. The account is the sender: Seemo sends from it to an
# address, or to everyone on one of the project's lists (one message each).
# Values live in .env; the daemon sends.
id: kiqr-smtp
name: Send email from your mail account
version: 0.4.0
summary: "Email over SMTP from your own address: Gmail with an app password, Fastmail, Outlook or any mail host. Send to anyone, or to a list of people you keep under Audience. Every send asks you first until you say otherwise."
categories: [email, publishing]
avatar: avatar.svg
icon: mail
service: { id: kiqr-smtp, name: Email, icon: mail, group: email }
transport: smtp
homepage: https://support.google.com/accounts/answer/185833
auth:
  - { env: SMTP_HOST, label: Mail server, placeholder: "smtp.gmail.com" }
  - { env: SMTP_PORT, label: Port, placeholder: "587", optional: true }
  - { env: SMTP_USER, label: User name, placeholder: "you@yourcompany.com", help: "Leave the user name and password empty only for a relay on this machine that asks for none", optional: true }
  - { env: SMTP_PASSWORD, label: Password or app password, help: "Gmail needs an app password: https://myaccount.google.com/apppasswords", optional: true }
  - { env: SMTP_FROM, label: From address, placeholder: "Your Name <you@yourcompany.com>", optional: true }
  - { env: SMTP_SECURITY, label: Security, help: "starttls for port 587, tls for 465, none only for a relay on this machine", optional: true, options: [starttls, tls, none] }
smtp:
  host: "${SMTP_HOST}"
  port: "${SMTP_PORT}"
  user: "${SMTP_USER}"
  password: "${SMTP_PASSWORD}"
  from: "${SMTP_FROM}"
  security: "${SMTP_SECURITY}"
provides:
  email:
    cost: free
kinds:
  # The account is the sender. Where a message goes is said per send (`to`),
  # or is a list in the Audience, sent from this account.
  - kind: email
    label: Email
    icon: mail
    section: list
    publish: email

# When KIQR suggests this to a new project: the goals it serves, and text in a site's HTML that shows the business already uses it.
fits:
  goals: [repeat, launch]
  html: []
