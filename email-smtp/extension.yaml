# Email over SMTP. Works with Gmail (an app password), Fastmail, Outlook,
# or any mail host. A mail server from the Vault is the sender: Seemo sends
# from it to an address, or to everyone on a mailing list (one message each).
# The daemon sends; the values never reach the model.
id: kiqr-smtp
name: Send email from your mail account
version: 0.5.0
summary: "Email over SMTP from your own address: Gmail with an app password, Fastmail, Outlook or any mail host. Send to anyone, or to a mailing list you keep under Channels. Every send asks you first until you say otherwise."
categories: [email, publishing]
avatar: avatar.svg
icon: mail
transport: smtp
homepage: https://support.google.com/accounts/answer/185833
# The mail server is a credential in the Vault (a mail server, any host).
credentials:
  - template: smtp
    for: Send email as you
    env: { SMTP_HOST: host, SMTP_PORT: port, SMTP_USER: username, SMTP_PASSWORD: password, SMTP_FROM: from, SMTP_SECURITY: security }
smtp:
  host: "${SMTP_HOST}"
  port: "${SMTP_PORT}"
  user: "${SMTP_USER}"
  password: "${SMTP_PASSWORD}"
  from: "${SMTP_FROM}"
  security: "${SMTP_SECURITY}"
provides:
  email:
    cost: free
kinds:
  # The mail server is the sender. Where a message goes is said per send (`to`),
  # or is a mailing list channel, sent from its mail server.
  - kind: email
    label: Email
    icon: mail
    section: list
    publish: email

# When KIQR suggests this to a new project: the goals it serves, and text in a site's HTML that shows the business already uses it.
fits:
  goals: [repeat, launch]
  html: []
