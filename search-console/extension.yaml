# Google Search Console with the same service account as Analytics. Clicks,
# impressions, CTR and position per day, plus the top queries and pages.
id: search-console
name: Read Google Search Console
version: 0.2.1
summary: "Clicks, impressions, click-through rate and average position per day, with the top queries and pages, once a day into Performance. Needs the service account added as a user on the property."
categories: [analytics, seo]
avatar: avatar.svg
icon: search
transport: http
homepage: https://developers.google.com/webmaster-tools/v1/searchanalytics/query
hosts: [searchconsole.googleapis.com, oauth2.googleapis.com]
auth:
  - { env: GSC_SITE_URL, label: Search Console property, help: "A domain property starts with sc-domain:; a URL-prefix property is its exact URL", placeholder: "sc-domain:yoursite.com" }
  - { env: GOOGLE_SERVICE_ACCOUNT_FILE, label: Service account key file, help: "Path on this machine to the JSON key of a service account added as a user on the property" }
connect:
  flow: service_account
  key_file: GOOGLE_SERVICE_ACCOUNT_FILE
  token_url: https://oauth2.googleapis.com/token
  scopes: [https://www.googleapis.com/auth/webmasters.readonly]
  token_env: GSC_TOKEN
sources:
  search:
    requests:
      - request:
          method: POST
          url: "https://searchconsole.googleapis.com/webmasters/v3/sites/${GSC_SITE_URL|urlencode}/searchAnalytics/query"
          headers: { Authorization: "Bearer ${GSC_TOKEN}" }
          json: { startDate: "{{from}}", endDate: "{{to}}", dimensions: [date], rowLimit: 1000 }
          timeout_s: 40
        rows: /rows
        date: /keys/0
        metrics: { clicks: /clicks, impressions: /impressions, ctr: /ctr, average_position: /position }
        scale: { ctr: 100 }
      - request:
          method: POST
          url: "https://searchconsole.googleapis.com/webmasters/v3/sites/${GSC_SITE_URL|urlencode}/searchAnalytics/query"
          headers: { Authorization: "Bearer ${GSC_TOKEN}" }
          json: { startDate: "{{from}}", endDate: "{{to}}", dimensions: [query], rowLimit: 25 }
          timeout_s: 40
        rows: /rows
        date: "{{to}}"
        dims: { query: /keys/0 }
        metrics: { clicks: /clicks, impressions: /impressions, average_position: /position }
        totals: []
      - request:
          method: POST
          url: "https://searchconsole.googleapis.com/webmasters/v3/sites/${GSC_SITE_URL|urlencode}/searchAnalytics/query"
          headers: { Authorization: "Bearer ${GSC_TOKEN}" }
          json: { startDate: "{{from}}", endDate: "{{to}}", dimensions: [page], rowLimit: 25 }
          timeout_s: 40
        rows: /rows
        date: "{{to}}"
        dims: { page: /keys/0 }
        metrics: { clicks: /clicks, impressions: /impressions, average_position: /position }
        totals: []
