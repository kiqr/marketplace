# Google Search Console. Connect with Google in one click (kiqr.cloud holds
# KIQR's Google app and finishes the sign-in; no token is kept there), or use
# a service account's key file on this machine. Either way the account then
# picks one of the properties it can see. Clicks, impressions, CTR and
# position per day, plus the top queries and pages.
id: search-console
name: Read Google Search Console
version: 0.5.0
summary: "Clicks, impressions, click-through rate and average position per day, with the top queries and pages, once a day into Performance. Connect with Google in one click, or use a service account."
categories: [analytics, seo]
avatar: avatar.svg
icon: search
# Shares the project's Google account with Google Analytics (the same sign-in,
# the same tokens); the Search Console property is a place on the account.
service: { id: google, name: Google, icon: globe, group: numbers }
transport: http
homepage: https://developers.google.com/webmaster-tools/v1/searchanalytics/query
hosts: [searchconsole.googleapis.com, oauth2.googleapis.com]
auth:
  # Kept by "Connect with Google"; never typed. Shared with Google Analytics.
  - { env: GOOGLE_TOKEN, label: Google sign-in, optional: true }
  - env: GOOGLE_SERVICE_ACCOUNT_FILE
    label: Service account key file
    optional: true
    help: "Instead of connecting with Google: the path on this machine to the JSON key of a service account added as a user on the property"
connect:
  # One click: kiqr.cloud holds the Google app, the browser comes back through its relay.
  - label: Connect with Google
    flow: cloud
    provider: google
    scopes: [https://www.googleapis.com/auth/analytics.readonly, https://www.googleapis.com/auth/webmasters.readonly]
    token_env: GOOGLE_TOKEN
    refresh_env: GOOGLE_REFRESH_TOKEN
  # Or a service account: KIQR signs a JWT with the key file and exchanges it
  # for a token at Google, offered to the requests as ${GOOGLE_TOKEN} (never stored).
  - flow: service_account
    key_file: GOOGLE_SERVICE_ACCOUNT_FILE
    token_url: https://oauth2.googleapis.com/token
    scopes: [https://www.googleapis.com/auth/analytics.readonly, https://www.googleapis.com/auth/webmasters.readonly]
    token_env: GOOGLE_TOKEN
# What the project picks once: its Search Console property, from those the
# Google account can see. Kept in the project, not on the account. `{{site}}`
# in the calls below.
settings:
  site:
    label: Search Console property
    help: "Pick it once the account is connected, or type it: a domain property starts with sc-domain:; a URL-prefix property is its exact URL"
    placeholder: "sc-domain:yoursite.com"
    choices:
      request:
        method: GET
        url: "https://searchconsole.googleapis.com/webmasters/v3/sites"
        headers: { Authorization: "Bearer ${GOOGLE_TOKEN}" }
        timeout_s: 20
      list: /siteEntry/*
      value: /siteUrl
sources:
  search:
    requests:
      - request:
          method: POST
          url: "https://searchconsole.googleapis.com/webmasters/v3/sites/{{site|urlencode}}/searchAnalytics/query"
          headers: { Authorization: "Bearer ${GOOGLE_TOKEN}" }
          json: { startDate: "{{from}}", endDate: "{{to}}", dimensions: [date], rowLimit: 1000 }
          timeout_s: 40
        rows: /rows
        date: /keys/0
        metrics: { clicks: /clicks, impressions: /impressions, ctr: /ctr, average_position: /position }
        scale: { ctr: 100 }
      - request:
          method: POST
          url: "https://searchconsole.googleapis.com/webmasters/v3/sites/{{site|urlencode}}/searchAnalytics/query"
          headers: { Authorization: "Bearer ${GOOGLE_TOKEN}" }
          json: { startDate: "{{from}}", endDate: "{{to}}", dimensions: [query], rowLimit: 25 }
          timeout_s: 40
        rows: /rows
        date: "{{to}}"
        dims: { query: /keys/0 }
        metrics: { clicks: /clicks, impressions: /impressions, average_position: /position }
        totals: []
      - request:
          method: POST
          url: "https://searchconsole.googleapis.com/webmasters/v3/sites/{{site|urlencode}}/searchAnalytics/query"
          headers: { Authorization: "Bearer ${GOOGLE_TOKEN}" }
          json: { startDate: "{{from}}", endDate: "{{to}}", dimensions: [page], rowLimit: 25 }
          timeout_s: 40
        rows: /rows
        date: "{{to}}"
        dims: { page: /keys/0 }
        metrics: { clicks: /clicks, impressions: /impressions, average_position: /position }
        totals: []

# When KIQR suggests this to a new project: the goals it serves, and text in a site's HTML that shows the business already uses it.
fits:
  goals: [customers]
  html: ["google-site-verification"]
