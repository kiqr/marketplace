# Google Analytics 4 through the Data API with a service account. The key
# file stays on this machine; KIQR reads sessions, users, page views, organic
# sessions and key events for the last 30 days, once a day, into snapshots.
id: google-analytics
name: Read Google Analytics
version: 0.2.1
summary: "Sessions, users, page views, organic sessions and key events from a GA4 property, once a day into Performance. Needs a service account added as a viewer on the property."
categories: [analytics]
avatar: avatar.svg
icon: chart
transport: http
homepage: https://developers.google.com/analytics/devguides/reporting/data/v1
hosts: [analyticsdata.googleapis.com, oauth2.googleapis.com]
auth:
  - { env: GA4_PROPERTY_ID, label: GA4 property id, help: "The number under Admin → Property settings", placeholder: "123456789" }
  - { env: GOOGLE_SERVICE_ACCOUNT_FILE, label: Service account key file, help: "Path on this machine to the JSON key of a service account that is a Viewer on the property (Google Cloud → IAM → Service accounts → Keys)" }
# The service account signs in by itself: KIQR signs a JWT with the key file
# and exchanges it for a token at Google, offered to the requests as
# ${GA4_TOKEN} (never stored).
connect:
  flow: service_account
  key_file: GOOGLE_SERVICE_ACCOUNT_FILE
  token_url: https://oauth2.googleapis.com/token
  scopes: [https://www.googleapis.com/auth/analytics.readonly]
  token_env: GA4_TOKEN
sources:
  traffic:
    requests:
      - request:
          method: POST
          url: "https://analyticsdata.googleapis.com/v1beta/properties/${GA4_PROPERTY_ID}:runReport"
          headers: { Authorization: "Bearer ${GA4_TOKEN}" }
          json:
            dateRanges: [{ startDate: "{{from}}", endDate: "{{to}}" }]
            dimensions: [{ name: date }, { name: sessionDefaultChannelGroup }]
            metrics: [{ name: sessions }, { name: totalUsers }, { name: screenPageViews }, { name: keyEvents }]
            limit: 10000
          timeout_s: 40
        rows: /rows
        date: /dimensionValues/0/value
        dims: { channel: /dimensionValues/1/value }
        metrics: { sessions: /metricValues/0/value, users: /metricValues/1/value, pageviews: /metricValues/2/value, key_events: /metricValues/3/value }
        breakdown: [sessions]
        skip_zero: true
    derive:
      - { metric: organic_sessions, sum: sessions, where: { channel: Organic Search } }
      - { metric: conversion_rate, ratio: [key_events, sessions], scale: 100 }
  conversions:
    requests:
      - request:
          method: POST
          url: "https://analyticsdata.googleapis.com/v1beta/properties/${GA4_PROPERTY_ID}:runReport"
          headers: { Authorization: "Bearer ${GA4_TOKEN}" }
          json:
            dateRanges: [{ startDate: "{{from}}", endDate: "{{to}}" }]
            dimensions: [{ name: date }, { name: eventName }]
            metrics: [{ name: keyEvents }]
            limit: 10000
          timeout_s: 40
        rows: /rows
        date: /dimensionValues/0/value
        dims: { event: /dimensionValues/1/value }
        metrics: { key_events: /metricValues/0/value }
        skip_zero: true
