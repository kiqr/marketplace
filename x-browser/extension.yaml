# X (Twitter) through the browser KIQR hosts, signed in as the user: the home
# timeline, a search, a thread; a reply and a post, each behind a card. One
# account is one X login; its profile lives with the account. The sign-in is
# read by the model page by page, and so is each reply and post: a goal the
# model reaches in the browser, with no selectors to go stale. Needs KIQR 0.6.0.
id: x-browser
name: Read, reply and post on X
version: 0.5.0
summary: "Your X account in a browser of Seemo's own: it reads your timeline and searches, replies and posts as you, each asking first until you say otherwise. Sign in once; the login is kept. Needs KIQR 0.6.0 or later."
categories: [social]
icon: message-circle
avatar: avatar.svg
transport: mcp
program: browser
exclusive: true
daily_cap: 15
hosts: [x.com, twitter.com]
credentials:
  - { template: login, hosts: [x.com], for: "Sign in to read, reply and post as you" }
url_args: [url]
expose: [browser_navigate, browser_read_text, browser_snapshot, browser_take_screenshot]
session:
  check:
    - { name: open, call: browser_navigate, args: { url: "https://x.com/home", wait_until: domcontentloaded } }
    # X draws everything after load, and its first frame has placeholders but no title and no controls:
    # wait (up to 20 s) for a title and a few controls, else the check reads a blank page.
    - { name: settle, call: browser_evaluate, args: { expression: "new Promise(r => { const t = Date.now(); (function w() { if ((document.title.trim() && document.querySelectorAll('input, button, [role=button], a[href]').length > 2) || Date.now() - t > 20000) r(location.href); else setTimeout(w, 400); })(); })" } }
    - { name: look, call: browser_snapshot }
  # No marker: the model reads the home page (a timeline and a compose box, or the sign-in buttons), in any language.
  # Signing in starts here; the model reads each page and names the fields, so the markup X serves (and its language) does not matter.
  login_url: "https://x.com/i/flow/login"
  # The model says when a page needs a person, in any language; these are a fast path.
  blocked_when: ["arkose"]
  every: 6h
live_view:
  frame: { name: frame, call: browser_watch }
  # The frame is the whole window; the page says where it sits in it (its size, and its offset from the window's corner), which puts a click on the page.
  metrics: { name: metrics, call: browser_evaluate, args: { expression: "({ ow: window.outerWidth, oh: window.outerHeight, iw: window.innerWidth, ih: window.innerHeight, ox: (window.mozInnerScreenX || 0) - window.screenX, oy: (window.mozInnerScreenY || 0) - window.screenY })" } }
  click: { name: click, call: browser_click_at, args: { x: "{{px}}", y: "{{py}}" } }
  key: { name: key, call: browser_press_key, args: { key: "{{key}}" } }
  # Typed text goes key by key: a real keystroke each, nothing set from a script.
  type: { name: type, call: browser_press_key, args: { key: "{{char}}" } }
  navigate: { name: navigate, call: browser_navigate, args: { url: "{{url}}", wait_until: domcontentloaded } }
tools:
  - name: read_feed
    label: Reading the X timeline
    description: The home timeline as text, newest first, with each post's link where the page shows it.
    input: { type: object, properties: {} }
    steps:
      - { name: open, call: browser_navigate, args: { url: "https://x.com/home", wait_until: domcontentloaded } }
      - { name: text, call: browser_read_text, args: { selector: "main" } }
    result: { text: /text }
  - name: search
    label: Searching X
    description: Latest posts for a query, as text with links.
    input: { type: object, properties: { query: { type: string } }, required: [query] }
    steps:
      - { name: open, call: browser_navigate, args: { url: "https://x.com/search?q={{query|urlencode}}&f=live", wait_until: domcontentloaded } }
      - { name: text, call: browser_read_text, args: { selector: "main" } }
    result: { text: /text }
  - name: read_thread
    label: Reading a post and its replies
    description: One post with its replies, as text.
    input: { type: object, properties: { url: { type: string, description: "The post's link on x.com" } }, required: [url] }
    steps:
      - { name: open, call: browser_navigate, args: { url: "{{url}}", wait_until: domcontentloaded } }
      - { name: text, call: browser_read_text, args: { selector: "main" } }
    result: { text: /text }
  # Acting is a goal a model reaches in the browser, page by page: no selectors to go stale.
  # KIQR types the approved text itself and checks it before the last click.
  - name: reply
    label: Replying on X
    description: Reply to a post as the connected account. The user sees the reply on a card first.
    role: reply
    target: "{{post_url}}"
    input: { type: object, properties: { post_url: { type: string }, text: { type: string, description: "The reply, at most 280 characters" } }, required: [post_url, text] }
    hand:
      goal: "Reply to the post at {{post_url}} with the approved text, as the signed-in account"
      start: "{{post_url}}"
  - name: post
    label: Posting on X
    description: Publish a post as the connected account, with the asset's first image when it has one.
    role: publish
    input: { type: object, properties: { text: { type: string }, image: { type: string } } }
    hand:
      goal: "Publish a post on X with the approved text and the approved image, as the signed-in account"
      start: "https://x.com/compose/post"
      image: required
kinds:
  # The account is the profile: connecting it puts it in the Audience.
  - kind: x
    label: X profile
    name: X
    icon: message-circle
    section: page
    account_is_target: true
    publish: post
    text_limit: 280
    image: { width: 1200, height: 675 }
    preview: feed
    writing: "Up to 280 characters, one idea, no hashtag pile; a question or a line that invites a reply."
fits:
  networks: [x, twitter]
