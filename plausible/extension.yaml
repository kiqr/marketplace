# Plausible Analytics (plausible.io or self-hosted): visitors, visits and
# page views per day through the Stats API.
id: plausible
name: Read Plausible Analytics
version: 0.2.0
summary: "Visitors, visits and page views per day from Plausible, hosted or self-hosted, once a day into Performance."
categories: [analytics]
avatar: avatar.svg
icon: chart
transport: http
homepage: https://plausible.io/docs/stats-api
hosts: [plausible.io, "${PLAUSIBLE_HOST}"]
auth:
  - { env: PLAUSIBLE_SITE_ID, label: Site, help: "The domain as Plausible shows it, e.g. example.com" }
  - { env: PLAUSIBLE_API_KEY, label: API key, help: "Settings → API keys in Plausible" }
  - { env: PLAUSIBLE_HOST, label: Host, help: "Only for self-hosted Plausible, e.g. https://plausible.example.com", optional: true }
sources:
  traffic:
    requests:
      - request:
          method: GET
          url: "${PLAUSIBLE_HOST|https://plausible.io}/api/v1/stats/timeseries"
          headers: { Authorization: "Bearer ${PLAUSIBLE_API_KEY}" }
          query: { site_id: "${PLAUSIBLE_SITE_ID}", period: custom, date: "{{from}},{{to}}", metrics: "visitors,visits,pageviews" }
          timeout_s: 40
        rows: /results
        date: /date
        metrics: { sessions: /visits, users: /visitors, pageviews: /pageviews }
