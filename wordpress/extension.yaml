# Publish articles to a WordPress site through its REST API, with an
# application password. Each channel is one site, with its own account.
id: wordpress
name: Publish articles to WordPress
version: 0.3.3
summary: "Articles from the library become WordPress posts, as drafts unless you say otherwise. Add a channel per site; each signs in with one button. Every publish asks you first."
categories: [publishing]
avatar: avatar.svg
icon: newspaper
transport: http
homepage: https://wordpress.org/documentation/article/application-passwords/
auth:
  - { env: WP_SITE, label: Your site's address, help: "https://myblog.com" }
  - { env: WP_USER, label: User name }
  - { env: WP_APP_PASSWORD, label: Application password, help: "Users → Profile → Application Passwords in wp-admin" }
hosts: ["${WP_SITE}"]
# One button instead of the three keys: WordPress's own "Authorize application"
# page (WordPress 5.6 and later) makes an application password for KIQR and
# sends it back. WordPress only sends it back over https; on a plain-http KIQR
# the page shows it once and the user pastes it.
connect:
  label: Connect with WordPress
  flow: redirect
  needs: [WP_SITE]
  url: "${WP_SITE}/wp-admin/authorize-application.php?app_name=KIQR&app_id={{app_id}}"
  callback_params: [success_url, reject_url]
  callback: https
  returns: { WP_SITE: site_url, WP_USER: user_login, WP_APP_PASSWORD: password }
  denied: { param: success, equals: "false" }
tools:
  - name: publish_article
    label: Publishing to WordPress
    description: Create a post from a title and HTML body; `status` is draft (default) or publish. The asset's image, when it has one, becomes the post's featured image.
    input: { type: object, properties: { title: { type: string }, html: { type: string }, status: { type: string, enum: [draft, publish], description: "draft (default) or publish; publish only when the user asked for it to go live" } }, required: [title, html] }
    steps:
      # The image first, into the media library, so the post can name it.
      - name: cover
        when: "{{files}}"
        request:
          method: POST
          url: "${WP_SITE}/wp-json/wp/v2/media"
          basic_auth: ["${WP_USER}", "${WP_APP_PASSWORD}"]
          headers: { Content-Disposition: 'attachment; filename="{{files.0.name}}"' }
          body_file: "{{files.0}}"
          timeout_s: 120
        save: { id: /id }
      - name: post
        request:
          method: POST
          url: "${WP_SITE}/wp-json/wp/v2/posts"
          basic_auth: ["${WP_USER}", "${WP_APP_PASSWORD}"]
          json: { title: "{{title}}", content: "{{html}}", status: "{{status|draft}}", featured_media: "{{cover.id}}" }
          timeout_s: 60
        save: { link: /link }
    result: { text: "{{post.link}}" }
channels:
  - kind: wordpress
    label: WordPress blog
    publish: publish_article
    # Draft or live is chosen per publish (the tool's `status`), not per site.
    destination: {}
