# A Slack channel through the Web API, as a Slack app's bot: the app has
# chat:write (and chat:write.public to post in public channels it was not
# invited to), is installed to the workspace, and its bot token is the
# credential in the Vault for slack.com. One message, then its permalink.
# Text only: a link in the text unfurls into a preview, so an article still
# shows its picture.
id: slack
name: Post in a Slack channel
version: 0.1.0
summary: "Posts and article announcements from the library go into a Slack channel: a community you are part of, or your own team's. Make a Slack app with chat:write, install it, and give KIQR its bot token. Every post asks you first until you say otherwise."
categories: [social, publishing]
avatar: avatar.svg
icon: hash
transport: http
homepage: https://api.slack.com/methods/chat.postMessage
hosts: [slack.com]
credentials:
  - template: api_key
    hosts: [slack.com]
    for: Post as the app
    env: { SLACK_TOKEN: key }
tools:
  - name: post_message
    label: Posting on Slack
    description: Post text in a channel (its ID, or its name with #). The bot must be a member of a private channel.
    input: { type: object, properties: { text: { type: string, description: "The message, in Slack's own marks (*bold*, _italic_, bare links)" }, channel: { type: string, description: "The channel's ID, or its name with #" } }, required: [text, channel] }
    steps:
      - name: post
        request:
          method: POST
          url: https://slack.com/api/chat.postMessage
          headers: { Authorization: "Bearer ${SLACK_TOKEN}", Content-Type: application/json }
          json: { channel: "{{channel}}", text: "{{text}}", unfurl_links: true }
          timeout_s: 30
        # Slack answers 200 with ok:false and an error word when it refuses.
        save: { ts: /ts, channel: /channel, error: /error }
      - name: link
        when: "{{post.ts}}"
        request:
          method: GET
          url: https://slack.com/api/chat.getPermalink
          headers: { Authorization: "Bearer ${SLACK_TOKEN}" }
          query: { channel: "{{post.channel}}", message_ts: "{{post.ts}}" }
          timeout_s: 30
        save: { url: /permalink }
    # The permalink, or Slack's error word when nothing was posted.
    result: { text: "{{link.url}}{{post.error}}" }
kinds:
  - kind: slack
    label: Channel
    name: Slack
    icon: hash
    section: community
    publish: post_message
    target:
      channel: { label: Channel, help: "The channel's ID (Channel details → About), or its name with #", placeholder: "#general", pattern: "^(#[a-z0-9._-]{1,80}|[CG][A-Z0-9]{8,})$" }
    text_limit: 4000
    preview: feed
    writing: "Plain text with Slack's own marks: *bold*, _italic_, a bare link. No Markdown headings, no [label](url) links, no hashtags. Short, three to six lines, the link last so it unfurls."
service: { id: slack, name: Slack, icon: hash, group: social }
